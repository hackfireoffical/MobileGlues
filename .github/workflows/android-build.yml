name: Build libmobileglues.so (Android arm64)

# Builds the native renderer library exactly the way build.gradle.kts describes it:
# MobileGlues-cpp/CMakeLists.txt, CMake 3.22.1, NDK 27.3.13750724, minSdk 21.
# The output is libmobileglues.so, NOT an installable APK -- see the README note in
# the pull request: ZH2 loads this library from the MobileGlues plugin app.
on:
  workflow_dispatch:
  push:
    branches: [frame-diagnostics]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NDK 27.3.13750724 and CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Configure
        run: |
          mkdir -p logs
          NDK="$ANDROID_HOME/ndk/27.3.13750724"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          "$CMAKE" -S MobileGlues-cpp -B build \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/3.22.1/bin/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee logs/configure.log

      - name: Build
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build build --target mobileglues 2>&1 | tee logs/build.log

      - name: Check the library exists
        run: |
          ls -l build/libmobileglues.so
          file build/libmobileglues.so | tee logs/file.log

      - name: Upload libmobileglues.so
        uses: actions/upload-artifact@v4
        with:
          name: libmobileglues-arm64-v8a
          path: build/libmobileglues.so
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
